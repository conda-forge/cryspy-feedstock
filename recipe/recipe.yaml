context:
  name: cryspy
  version: "0.16.0"
  python_min: "3.9" # https://github.com/prefix-dev/rattler-build/pull/1122

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/0d/89/1010936a586bb496e79c28a2ed30f9b1701a1a0b4ddb42faa030c4c74121/cryspy-${{ version }}.tar.gz
  sha256: 175615afe23d16df5a1d44f0f2d1faba476879f19e8d3da3fbc000f4acb5cdc9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - versioningit
  run:
    - python >=${{ python_min }}
    - numpy
    - scipy
    - pycifstar
    - matplotlib-base

tests:
  - script: python -c "import cryspy"
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  summary: PNPD data analysis
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/ikibalin/cryspy

extra:
  recipe-maintainers:
    - MridulS
