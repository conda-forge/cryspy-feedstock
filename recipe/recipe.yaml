context:
  name: cryspy
  version: "0.17.0"
  python_min: "3.10"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/35/f4/ec1999dcaa4270c52047e636a17e62427503d8e0ab1ac081cd104a1e741f/cryspy-${{ version }}.tar.gz
  sha256: 5397db961ce8f85d7f0571ff2bc3410e421e28659aeb5b79209bbe0e1213a455

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - versioningit
  run:
    - python >=${{ python_min }}
    - numpy >=2.0
    - scipy >=1.13
    - pycifstar
    - matplotlib-base >=3.9

tests:
  - script: python -c "import cryspy"
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  summary: PNPD data analysis
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/ikibalin/cryspy

extra:
  recipe-maintainers:
    - conda-forge/easyscience
    - MridulS
