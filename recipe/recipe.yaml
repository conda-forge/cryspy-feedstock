context:
  name: cryspy
  version: "0.18.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/47/6a/b6a9977cc8928096d58b524a4cf779919b413af0ebc14c9586a679746bf0/cryspy-${{ version }}.tar.gz
  sha256: c0e33311ee3eb56d800198297d850955e9f55ef58596c0836a67036fc520b4d9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - versioningit
  run:
    - python >=${{ python_min }}
    - numpy >=2.0
    - scipy >=1.13
    - pycifstar
    - matplotlib-base >=3.9

tests:
  - script: python -c "import cryspy"
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  summary: PNPD data analysis
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/ikibalin/cryspy

extra:
  recipe-maintainers:
    - conda-forge/easyscience
    - MridulS
